<g clip-path="url(#clip)"><rect width="1024" height="1024" fill="url(#bgg)"/><rect width="1024" height="1024" filter="url(#grain)" opacity=".95"/></g>
<g transform="translate(512 512) scale(1.0) translate(-512 -512)">
