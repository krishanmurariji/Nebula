org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
android.useAndroidX=true
android.enableJetifier=true

# The project (D:) and Flutter's pub cache (C:) are on different drives, which
# crashes Kotlin's incremental-compile cache ("this and base files have
# different roots") and forces a slow fallback on every plugin. Plain
# non-incremental compilation is reliable on any layout.
kotlin.incremental=false
org.gradle.parallel=true
