name: Emulator tests

# The real app on an Android emulator: first run, search, tap a song,
# then airplane mode (offline pill, offline search) and My Music with the
# permission granted. Screenshots and the device log are kept as artifacts.
#
# YouTube often refuses GitHub's network, so "playback" is reported, not
# required; crashes, missing feedback and the offline behaviour are.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["lib/**", "android/**", "integration_test/**", "pubspec.yaml",
            ".github/workflows/emulator.yml"]

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned with the APK workflow (Flutter 3.50+ needs Gradle 9.3+).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: flutter pub get

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # `flutter drive` uninstalls the app when it finishes, so a grant
          # made between the two runs is lost. A background loop keeps
          # granting for four minutes, so the second run's fresh install
          # gets it (the app checks again each time My Music opens).
          script: |
            adb logcat -c || true
            mkdir -p build
            python3 -c "import wave;w=wave.open('build/tone.wav','wb');w.setnchannels(1);w.setsampwidth(2);w.setframerate(8000);w.writeframes(bytes(16000*40));w.close()" || true
            # Shared storage is not writable for a while after boot: retry.
            for i in $(seq 1 30); do adb shell mkdir -p /sdcard/Music 2>/dev/null; adb push build/tone.wav "/sdcard/Music/Noor Test Tone.wav" && break; sleep 3; done
            adb shell content call --method scan_volume --uri content://media --arg external_primary || true
            timeout 900 flutter drive --driver=test_driver/integration_test.dart --target=integration_test/online_test.dart -d emulator-5554 2>&1 | tee build/online.log
            adb shell cmd connectivity airplane-mode enable
            (for i in $(seq 1 240); do adb shell pm grant com.noor.music android.permission.READ_MEDIA_AUDIO 2>/dev/null && adb shell pm grant com.noor.music android.permission.POST_NOTIFICATIONS 2>/dev/null && echo "granted at ${i}s"; sleep 1; done) > build/grants.log 2>&1 &
            timeout 600 flutter drive --driver=test_driver/integration_test.dart --target=integration_test/offline_test.dart -d emulator-5554 2>&1 | tee build/offline.log
            adb shell cmd connectivity airplane-mode disable
            adb logcat -d > build/logcat.txt || true
            tail -3 build/grants.log || true
            # flutter drive can print "All tests passed." even when a test
            # failed or timed out, so the job decides from the test output.
            ! grep -qE "Some tests failed|Test timed out|tests? failed" build/online.log build/offline.log
            grep -q "All tests passed" build/online.log && grep -q "All tests passed" build/offline.log

      - name: Keep screenshots and the device log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: |
            build/emulator_shots/
            build/logcat.txt
          retention-days: 14
