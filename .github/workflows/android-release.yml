name: Android APK

# What triggers a build, and what it produces:
#   push to master / claude/**  → a release "build-<number>", marked latest
#   push of a tag like v1.2.0   → a permanent, versioned GitHub Release
#   manual "Run workflow"       → same as a branch push
#
# Stable download link for the phone / the future website:
#   https://github.com/<owner>/<repo>/releases/latest/download/noor.apk   (newest build)

on:
  push:
    branches: [master, main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create/replace releases

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned: newer Flutter (3.50+) needs Gradle 9.3+, which this project
      # does not use yet. Bump together with the Gradle wrapper.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      # ── Signing ────────────────────────────────────────────────────────────
      # Updates only install over an existing app if every build is signed with
      # the SAME key, so the key lives in GitHub secrets (see docs/RELEASING.md).
      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            if [ "$IS_TAG" = "true" ]; then
              echo "::error::Signing secrets are missing. Refusing to publish a versioned release signed with a throwaway key. See docs/RELEASING.md."
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets: building with a throwaway debug key. Installing this APK over a previous build will fail until you uninstall the old app. See docs/RELEASING.md."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android/noor-release.jks"
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$GITHUB_WORKSPACE/android/noor-release.jks"
          } > "$GITHUB_WORKSPACE/android/key.properties"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # ── Version ────────────────────────────────────────────────────────────
      # build-number must grow with every build or the phone refuses the update.
      - name: Work out version
        id: ver
        run: |
          if [ "$IS_TAG" = "true" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9.]+).*/\1/')"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          # The app shows these in Settings → About (version, build, commit).
          flutter build apk --release \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="${{ steps.ver.outputs.number }}" \
            --dart-define=NOOR_VERSION="${{ steps.ver.outputs.name }}" \
            --dart-define=NOOR_BUILD="${{ steps.ver.outputs.number }}" \
            --dart-define=NOOR_COMMIT="${GITHUB_SHA::7}"
          cp build/app/outputs/flutter-apk/app-release.apk noor.apk
          sha256sum noor.apk | tee noor.apk.sha256
          ls -lh noor.apk

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-apk
          path: |
            noor.apk
            noor.apk.sha256
          retention-days: 14

      # ── Publish ────────────────────────────────────────────────────────────
      - name: Publish versioned release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" noor.apk noor.apk.sha256 \
            --title "Noor ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

      - name: Publish build release (branches / manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          {
            echo "Newest build from \`${GITHUB_REF_NAME}\` @ \`${SHORT}\` (build #${{ steps.ver.outputs.number }})."
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Signed with the Noor release key: installs as an update over earlier builds."
            else
              echo "**Signed with a throwaway debug key.** Uninstall any earlier Noor (or Nebula) before installing this one."
            fi
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 noor.apk.sha256)\`"
          } > notes.md
          # Each build is its own release (build-<number>), marked "latest", so
          #   https://github.com/<owner>/<repo>/releases/latest/download/noor.apk
          # always serves the newest APK. This works with "immutable releases"
          # turned on (a release tag can never be reused, so none is).
          TAG="build-${{ steps.ver.outputs.number }}"
          gh release create "$TAG" noor.apk noor.apk.sha256 \
            --latest \
            --target "$GITHUB_SHA" \
            --title "Noor build #${{ steps.ver.outputs.number }} (${SHORT})" \
            --notes-file notes.md
