<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="170" viewBox="0 0 1280 170" role="img" aria-label="Noor in numbers: no API key or account, one swipe to like, file or delete a song, up to 10 playlists, 3 lists ready on Home"><title>Noor in numbers</title><rect x=".5" y=".5" width="1279" height="169" rx="24" fill="#FFFFFF" stroke="#8E4A27" stroke-opacity=".35"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.000;0.060;.92;1" dur="9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 16;0 16;0 0;0 0;0 0" keyTimes="0;0.000;0.060;.92;1" dur="9s" repeatCount="indefinite"/><text x="160" y="88" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,'Times New Roman',serif" font-style="italic" font-size="50" fill="#8E4A27">0</text><text x="160" y="122" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#A27B66">API keys or accounts</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.050;0.110;.92;1" dur="9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 16;0 16;0 0;0 0;0 0" keyTimes="0;0.050;0.110;.92;1" dur="9s" repeatCount="indefinite"/><text x="480" y="88" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,'Times New Roman',serif" font-style="italic" font-size="50" fill="#8E4A27">1 swipe</text><text x="480" y="122" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#A27B66">to like, file or delete</text></g><rect x="320" y="52" width="1" height="72" fill="#8E4A27" opacity=".2"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.100;0.160;.92;1" dur="9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 16;0 16;0 0;0 0;0 0" keyTimes="0;0.100;0.160;.92;1" dur="9s" repeatCount="indefinite"/><text x="80